[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lsis-afs-test-vectors"
version = "0.7.0"
description = "Staged LSIS-AFS interoperability test-vector package (Levels 1–5) plus the perf-card decoder benchmarking harness. Levels 1–5: spreading codes, encoded frames, baseband I/Q signals, PocketSDR-AFS cross-decode outputs, and parsed nav-data JSONs — validated against LNIS AD1 Volume A Annex 3, LANS-AFS-SIM, LSIS V1.0 §2.4, and PocketSDR-AFS. Perf-card: a reproducible FEC decoder performance benchmark with run/validate/compare/self-test/leaderboard subcommands, a binary stdio adapter contract, shipped reference codeword pool, and adapter templates in Python and C — turns characterising any LDPC/BCH decoder against the LSIS-AFS standard into a single command."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["LSIS-AFS", "LunaNet", "PNT", "GNSS", "spreading-codes", "CCSDS", "ESA", "interoperability", "test-vectors", "LDPC", "BCH", "decoder-benchmark"]
authors = [{ name = "Marco Fiscato" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Testing",
]
# numpy is now required (perf_card.py uses it heavily; validate.py's L3
# fast path also uses it). Promoted from the previous [fast] optional dep.
dependencies = [
    "numpy>=1.20",
]

[project.scripts]
lsis-afs-validate = "validate:main"
perf-card = "perf_card:main"

[project.urls]
Repository = "https://github.com/luar-space/lsis-afs-test-vectors"
Issues = "https://github.com/luar-space/lsis-afs-test-vectors/issues"

[tool.hatch.build.targets.wheel]
only-include = [
    "validate.py",
    "perf_card.py",
    "perf_card_mock_adapter.py",
    "perf_card_reference_card.json",
    "perf_card_reference_codewords.npz",
    "perf_card_templates",
    "codes",
    "frames",
    "inputs",
    "signals",
    "references",
    "manifest.json",
    "README.md",
    "CORRECTNESS.md",
    "CHANGELOG.md",
    "INTEROP-ROUNDROBIN.md",
    "PERF-CARD-STANDARD.md",
    "CITATION.cff",
]

[tool.hatch.build.targets.sdist]
only-include = [
    "validate.py",
    "perf_card.py",
    "perf_card_mock_adapter.py",
    "perf_card_reference_card.json",
    "perf_card_reference_codewords.npz",
    "perf_card_templates",
    "codes",
    "frames",
    "inputs",
    "signals",
    "references",
    "manifest.json",
    "README.md",
    "CORRECTNESS.md",
    "CHANGELOG.md",
    "INTEROP-ROUNDROBIN.md",
    "PERF-CARD-STANDARD.md",
    "CITATION.cff",
    "LICENSE",
    "pyproject.toml",
    "tests",
    "tools",
    ".github/workflows/verify.yml",
    ".github/workflows/perf_card.yml",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "F", "W",     # pycodestyle + pyflakes
    "I",               # isort
    "N",               # pep8-naming
    "UP",              # pyupgrade
    "B",               # flake8-bugbear
    "SIM",             # flake8-simplify
    "PL",              # pylint
    "RUF",             # ruff-specific
]
ignore = [
    "PLR2004",         # magic numbers are fine in a validator of fixed-length formats
    "PLR0913",         # "too many arguments" — argparse callbacks set by design
    "RUF001",          # `×` in user-facing strings is intentional (math notation)
    "RUF002",          # `×` in docstrings is intentional (math notation)
    "RUF003",          # `×` in comments is intentional (math notation)
]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
